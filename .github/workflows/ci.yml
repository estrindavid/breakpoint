# Checks every pull request and every push to main, on both platforms:
#
#   macOS    a debug build with zero warnings, the unit tests (scripts/test.sh) and the end-to-end
#            flows (scripts/e2e.sh: the debug app headless, with temporary home folders, driven
#            through the CLI).
#   Windows  the same three on Windows (scripts/windows/*.ps1), then the release build packaged
#            as it ships, started on a runner with no Swift toolchain on PATH.
#
# See CONTRIBUTING.md.
#
# Safe for pull requests from forks: `pull_request` (never `pull_request_target`), a read-only
# token, no secrets, and checkout without stored credentials.
#
# No build cache, on purpose: Swift prints a warning only when it compiles the file, so a restored
# .build would hide warnings in files the change did not touch. A clean debug build takes a few
# minutes on the runner.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its older run; runs on main are never cancelled.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # This name is the status check that branch protection requires (docs/MAINTAINING.md).
    name: Build and test
    # Same runner as the release workflow: the code needs the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          swift --version
          xcode-select -p
          xcrun --show-sdk-version

      - name: Build with zero warnings
        run: |
          set -o pipefail
          swift build 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -E ': warning: |^warning: ' "$RUNNER_TEMP/build.log"; then
            echo "::error::The build has warnings (listed above). The project builds with zero warnings."
            exit 1
          fi

      - name: Unit tests
        run: |
          set -o pipefail
          scripts/test.sh 2>&1 | tee "$RUNNER_TEMP/test.log"
          if grep -E ': warning: |^warning: ' "$RUNNER_TEMP/test.log"; then
            echo "::error::Building the tests produced warnings (listed above)."
            exit 1
          fi

      - name: End-to-end flows
        run: scripts/e2e.sh -v

  windows:
    # A separate check, so the macOS one keeps the name branch protection requires.
    name: Build and test (Windows)
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Swift toolchain
        # swift.org's installer, checked against a pinned SHA-256 (no setup action: the repository
        # allows only SHA-pinned actions, and those use others by tag).
        run: scripts/windows/install-swift.ps1

      - name: Toolchain
        run: |
          swift --version
          git config --get core.autocrlf

      - name: Build with zero warnings
        run: scripts/windows/build.ps1 -CheckWarnings

      - name: Unit tests
        run: scripts/windows/test.ps1 -CheckWarnings

      - name: Package as released, then run it without the toolchain
        run: |
          scripts/windows/package.ps1 -Version (scripts/windows/version.ps1) -OutDir build/release
          scripts/windows/smoke.ps1 -Zip (Get-ChildItem build/release/Breakpoint-*-windows-x64.zip).FullName

  windows-e2e:
    # The end-to-end flows start the app and the CLI hundreds of times, and starting a process on a
    # Windows runner is slow: the flows are split across four parallel jobs (E2E_SHARD).
    name: End-to-end (Windows ${{ matrix.shard }}/4)
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Swift toolchain
        # swift.org's installer, checked against a pinned SHA-256 (no setup action: the repository
        # allows only SHA-pinned actions, and those use others by tag).
        run: scripts/windows/install-swift.ps1

      - name: End-to-end flows
        env:
          E2E_SHARD: ${{ matrix.shard }}/4
        run: scripts/windows/e2e.ps1 -Verbose
