name: Bug report
description: Something in Breakpoint does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please check the [open issues](https://github.com/estrindavid/breakpoint/issues) first.
        **A security problem?** Do not file it here: see [SECURITY.md](https://github.com/estrindavid/breakpoint/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Claude Code started a run with a stretch due.
        2. Expected the nudge "2-min stretch?".
        3. Nothing appeared.
    validations:
      required: true

  - type: input
    id: breakpoint-version
    attributes:
      label: Breakpoint version
      description: Settings → About shows it, or run `/Applications/Breakpoint.app/Contents/Helpers/breakpoint --version`.
      placeholder: "0.3.0"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu → About This Mac.
      placeholder: "macOS 26.1"
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Coding agent involved
      multiple: true
      options:
        - Claude Code
        - Cursor
        - Codex CLI
        - Codex CLI (legacy notify)
        - Copilot CLI
        - Gemini CLI
        - Shell integration (long commands)
        - Another tool using `breakpoint emit`
        - None, or not related to an agent
    validations:
      required: true

  - type: input
    id: agent-version
    attributes:
      label: That agent's version
      description: Optional. Hook formats change between versions, so this often helps.

  - type: textarea
    id: doctor
    attributes:
      label: Output of `breakpoint doctor` (if the problem involves an agent, the app not responding, or breaks not being offered)
      description: |
        Run it in Terminal while Breakpoint is running:
        `/Applications/Breakpoint.app/Contents/Helpers/breakpoint doctor`
        (or `~/Applications/…` if it is installed there).

        **What it prints, so you can decide before pasting it publicly:** the Breakpoint version and your
        home folder path (which usually contains your macOS user name; replace it if you like); whether
        the app answers on its local socket and the socket's file permissions; for each supported tool,
        whether its hooks are installed and when the last event arrived; and the signal report described
        below. It does not print prompts, code, project folders, app names or device names.
      render: text

  - type: textarea
    id: signals
    attributes:
      label: Output of `Breakpoint --signals` (if breaks appear at the wrong time, or a call is not noticed)
      description: |
        Run `/Applications/Breakpoint.app/Contents/MacOS/Breakpoint --signals`. It prints a report and exits
        (no need to quit the running copy). `breakpoint doctor` already includes this report while the app runs.

        **What it prints:** seconds since the last input, key and click; whether a mouse button is down;
        whether something keeps the display awake; lock, display sleep, screen saver and session state; one
        line per audio device with only its kind (built-in, Bluetooth, USB…), direction, whether it is in use
        and its sample rate; and whether a microphone or camera is in use. No device names, identifiers or app
        names.
      render: text

  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: |
        Screenshots or screen recordings of what you saw, and anything unusual about your setup (several
        displays, a headset, a different home folder). Please do not paste the output of `breakpoint status`
        here: it contains your project folder paths.
